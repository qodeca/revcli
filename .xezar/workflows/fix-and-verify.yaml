name: fix-and-verify
description: Do the task, then run this project's own check (npm test); if it fails, the agent gets the failing output and tries again.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: implement
    name: Do the task
    prompt: "{{task}}"
  # Examples of a check, by kind of project (none of them authorizes publishing or sending anything):
  #   software:            run the existing relevant tests, e.g. command: "npm test" or "pytest"
  #   advertising agency:  check the campaign draft's audience, budget and claims against the supplied brief
  #   scientific research: check the revised section's citations, methods and stated limitations against the sources
  - id: verify
    name: Run the project's check
    command: "npm test"
    onFail:
      retry: implement
      max: 2
