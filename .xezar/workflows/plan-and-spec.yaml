name: plan-and-spec
description: Design an approach and write a right-sized spec under docs/specs/ before substantial work, with criteria each checkable by a named command.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: plan
    name: Design and specify
    prompt: "{{task}}"
    skill: revcli-planning-spec
    timeout: 2h
  - id: typecheck
    name: Type check (proves the repo is untouched and green)
    command: npm run typecheck
    onFail:
      retry: plan
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: plan
      max: 2
  - id: report
    name: Report the spec for approval
    prompt: |
      The spec for this task is written:

      {{task}}

      Report where the spec lives, the acceptance criteria with their IDs and the command or
      inspection that decides each one, the modules the design touches, the risks you named (output
      contract, anti-bot and auth behaviour, rate limiting, reviewer PII), and what the spec leaves
      open — including anything only a live signed-in scrape can prove. These two checks are a no-op
      confirmation that the repository is still green, not evidence that the plan is right: the real
      check is a reader confirming every criterion is decidable. Ask for approval before any build
      work starts, and commit or push nothing this task did not authorize.
    skill: revcli-quality-gates
