name: feature-implementation
description: Implement a feature end to end — Zod contract first, pure testable helper, tests, docs — then typecheck, test and build.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: implement
    name: Implement
    prompt: "{{task}}"
    skill: revcli-implementation
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: implement
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: implement
      max: 2
  - id: build
    name: Build the CLI
    command: npm run build
    onFail:
      retry: implement
      max: 2
  - id: report
    name: Report the evidence
    prompt: |
      The checks above have run for this task:

      {{task}}

      Report what was verified and what was delivered: each command with its revision and outcome,
      the new or changed behaviour, the test that covers it and proof that the test was red before
      the change, the documentation updated (README for users, AGENTS.md for agents, the selector
      guide if selectors moved), and every part of the request that only a live signed-in scrape can
      prove — declared as not verifiable here. Do not invent a check, weaken one, or push and publish
      anything this task did not authorize.
    skill: revcli-quality-gates
