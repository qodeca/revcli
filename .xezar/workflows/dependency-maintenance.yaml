name: dependency-maintenance
description: Update dependencies in focused batches (runtime, then toolchain), lockfile included, verified by typecheck, tests and build.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: deps
    name: Survey and update
    prompt: "{{task}}"
    skill: revcli-dependency-maintenance
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: deps
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: deps
      max: 2
  - id: build
    name: Build the CLI
    command: npm run build
    onFail:
      retry: deps
      max: 2
  - id: report
    name: Report the update
    prompt: |
      The checks above have run for this dependency work:

      {{task}}

      Report each batch (package, old version, new version, why), that package.json and
      package-lock.json moved together, the outcome of every command with its revision, and any code
      the upgrade forced — kept in the module that owns the API, never as a relaxed type or schema.
      Name the residual risk honestly: this suite never launches a browser, so a Playwright change
      is unproven until the owner re-runs npx playwright install chromium and a live scrape. Publish
      nothing; a version bump is not part of this task unless it said so.
    skill: revcli-quality-gates
