name: testing-and-verification
description: Add or strengthen test coverage in this repo's pure-function style, without weakening anything.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: tests
    name: Write and run tests
    prompt: "{{task}}"
    skill: revcli-testing
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: tests
      max: 2
  - id: test
    name: Run the full suite
    command: npm test
    onFail:
      retry: tests
      max: 2
  - id: report
    name: Report coverage and gaps
    prompt: |
      The checks above have run for this test work:

      {{task}}

      Report which behaviours are now covered and how, which tests you proved were red before the
      change, whether any new logic had to be extracted into a pure helper to become testable, and
      what remains uncovered. Any live-scrape path against Google Maps is uncovered by design and
      needs the owner's signed-in browser — say so plainly rather than implying coverage you do not
      have. Commit and push nothing unless this task authorized it.
    skill: revcli-quality-gates
