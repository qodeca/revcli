name: docs-maintenance
description: Update documentation so every command, flag and selector it names matches the code, then prove the repo is still green.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: docs
    name: Update the docs
    prompt: "{{task}}"
    skill: revcli-docs-maintenance
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: docs
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: docs
      max: 2
  - id: report
    name: Report the doc audit
    prompt: |
      The checks above have run for this documentation change:

      {{task}}

      Report which files changed, which documented commands and flags you re-verified against
      package.json and the CLI's own --help output, which relative links you confirmed resolve, and
      every statement you could not check. Say explicitly that a documentation change proves
      nothing about runtime behaviour: only a live signed-in scrape shows whether scraping still
      works, and that was not run here. Commit and push nothing unless this task authorized it.
    skill: revcli-quality-gates
