name: bug-fix
description: Reproduce the bug, pin it with a regression test that fails first, fix the root cause, then run this repo's own checks.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: investigate
    name: Reproduce, diagnose and fix
    prompt: "{{task}}"
    skill: revcli-bug-investigation
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: investigate
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: investigate
      max: 2
  - id: report
    name: Report the evidence
    prompt: |
      The checks above have run for this task:

      {{task}}

      Report what was actually verified: the command, the revision it ran on and its outcome for
      each of typecheck and the test suite; the regression test that pins the fix and proof that it
      fails without the fix; what you changed and why that is the cause rather than the symptom.
      Name anything still unverified — most often a live scrape, which needs the owner's signed-in
      browser and was not run here. Do not weaken a check or describe as verified anything you did
      not run, and commit, push or publish nothing unless this task said so.
    skill: revcli-quality-gates
