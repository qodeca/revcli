name: selector-maintenance
description: Repair stale Google Maps selectors — diagnose from verbose evidence, change only src/scraper/selectors.ts, keep the guard tests and the selector guide in step.
steps:
  # A task runs in its own worktree, which is a fresh checkout with no node_modules.
  # Install once, then the checks below can run. Skips cleanly in the primary checkout.
  - id: setup
    name: Prepare dependencies
    command: '[ -d node_modules ] || npm ci'
  - id: selectors
    name: Diagnose and repair selectors
    prompt: "{{task}}"
    skill: revcli-selector-maintenance
    timeout: 2h
  - id: typecheck
    name: Type check
    command: npm run typecheck
    onFail:
      retry: selectors
      max: 2
  - id: test
    name: Run the test suite
    command: npm test
    onFail:
      retry: selectors
      max: 2
  - id: build
    name: Build the CLI
    command: npm run build
    onFail:
      retry: selectors
      max: 2
  - id: report
    name: Report the repair
    prompt: |
      The checks above have run for this selector repair:

      {{task}}

      Report the evidence you diagnosed from (which --verbose lines, which fallback rung parsed), the
      exact selector changes, that the Last verified date and docs/selector-maintenance.md moved with
      them, and the guard test that pins the new shape — with proof it fails against the old broken
      form. State plainly that unit tests prove only the selector shape and parsing: whether reviews
      flow again is proven by a live signed-in scrape, which was not run here unless this task
      authorized it. Commit, push and publish nothing beyond that authorization.
    skill: revcli-selector-maintenance
