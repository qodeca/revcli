name: CI

# The PR/push gate. Runs the same validation the Release workflow runs before it publishes
# (typecheck + tests) and the packaging checks (build, tarball contents, install smoke test),
# so a broken build or a bloated tarball is caught on the PR rather than at release time.
#
# This workflow never publishes and never needs credentials — it only reads the repository.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, tests, package)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # `check:pack` needs dist/ to exist, and `test:package` installs the tarball into an
      # isolated consumer and runs `revcli --version` — no Chromium download needed, because
      # printing the version never launches a browser.
      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run check:pack

      - name: Install smoke test
        run: npm run test:package
